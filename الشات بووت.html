<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>مُعلّم أوفيس الذكي | Smart Office Tutor</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--surface:#ffffff;--text:#0f172a;--muted:#64748b;--primary:#2563eb;--primary-soft:#dbeafe;--border:#e2e8f0;--success:#16a34a;--warn:#f59e0b;--danger:#dc2626}
[data-theme="dark"]{--bg:#0b1120;--surface:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--border:#334155;--primary:#3b82f6;--primary-soft:#1e3a8a}
[data-theme="blue"]{--bg:#eff6ff;--surface:#ffffff;--text:#1e3a8a;--muted:#3b82f6;--border:#bfdbfe;--primary:#1d4ed8;--primary-soft:#dbeafe}
[data-theme="green"]{--bg:#f0fdf4;--surface:#ffffff;--text:#14532d;--muted:#16a34a;--border:#bbf7d0;--primary:#15803d;--primary-soft:#dcfce7}
[data-theme="purple"]{--bg:#faf5ff;--surface:#ffffff;--text:#4c1d95;--muted:#8b5cf6;--border:#ddd6fe;--primary:#7c3aed;--primary-soft:#ede9fe}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Cairo','Inter',sans-serif;transition:background .3s,color .3s;display:flex;flex-direction:column}
[dir="ltr"] body{font-family:'Inter','Cairo',sans-serif}
.surface{background:var(--surface);border:1px solid var(--border)}
.text-muted{color:var(--muted)}
.btn-primary{background:var(--primary);color:#fff;border:none;cursor:pointer;transition:all .2s}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-soft{background:var(--primary-soft);color:var(--primary);border:none;cursor:pointer;transition:all .2s}
.btn-soft:hover{filter:brightness(.95)}
.card-hover{transition:all .2s}.card-hover:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(0,0,0,.08)}

/* ══════════ DEVICE VIEWPORT SIMULATION FRAMES ══════════ */
.app-shell{flex:1;display:flex;overflow:hidden;height:calc(100vh - 56px)}
.viewport-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:8px}
.app-frame{width:100%;height:100%;margin:0 auto;transition:all .35s cubic-bezier(0.22, 1, 0.36, 1);background:var(--bg);position:relative;overflow-y:auto;overflow-x:hidden;padding:12px}

.app-frame.desktop{max-width:100%;border-radius:12px;border:none}
.app-frame.laptop{
  max-width:1024px;
  height:92%;
  border-radius:16px 16px 4px 4px;
  border:8px solid #1e293b;
  border-bottom-width:14px;
  box-shadow:0 20px 50px -12px rgba(0,0,0,.35), 0 0 0 2px #475569;
  padding:14px;
}
.laptop-base{
  width:100%;
  max-width:1080px;
  height:12px;
  background:linear-gradient(180deg, #94a3b8 0%, #475569 100%);
  border-radius:0 0 14px 14px;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
  margin:0 auto;
  position:relative;
  flex-shrink:0;
}
.laptop-base::after{
  content:'';
  position:absolute;
  top:0;left:50%;transform:translateX(-50%);
  width:110px;height:4px;
  background:#334155;
  border-radius:0 0 6px 6px;
}
.app-frame.mobile{
  max-width:390px;
  height:96%;
  border-radius:38px;
  border:10px solid #0f172a;
  box-shadow:0 20px 55px -10px rgba(0,0,0,.45), 0 0 0 3px #334155;
  padding:12px;
  padding-top:24px;
}
.app-frame.mobile::before{
  content:'';
  position:sticky;
  top:-16px;
  display:block;
  width:100px;
  height:16px;
  background:#0f172a;
  border-radius:999px;
  margin:-16px auto 10px auto;
  z-index:30;
}
.app-frame.mobile .grid-cols-2,
.app-frame.mobile .md\:grid-cols-2,
.app-frame.mobile .md\:grid-cols-3,
.app-frame.mobile .md\:grid-cols-4{
  grid-template-columns: repeat(1, minmax(0, 1fr)) !important;
}
.app-frame.mobile .md\:flex-row{
  flex-direction: column !important;
  align-items: flex-start !important;
}

.view-btn{transition:all .2s;color:var(--muted)}
.view-btn.active{background:var(--primary);color:#ffffff;font-weight:700;box-shadow:0 2px 8px rgba(37,99,235,.3)}

::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(100,116,139,.35);border-radius:4px}
.chat-user{background:var(--primary);color:#fff;border-radius:18px 18px 4px 18px;padding:10px 14px;max-width:85%;word-wrap:break-word}
.chat-ai{background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 18px 4px;padding:12px 16px;max-width:88%;word-wrap:break-word}
[dir="ltr"] .chat-user{border-radius:18px 18px 18px 4px}
[dir="ltr"] .chat-ai{border-radius:18px 18px 4px 18px}
.pulse-rec{animation:pulse 1.2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hidden{display:none!important}
.fade-in{animation:fadeIn .3s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:12px 22px;border-radius:12px;z-index:9999;box-shadow:0 10px 25px rgba(0,0,0,.25);animation:fadeIn .3s;font-weight:600;font-size:14px}
.sidebar-link.active{background:var(--primary-soft);color:var(--primary);font-weight:700}
.chip{background:var(--primary-soft);color:var(--primary);padding:5px 12px;border-radius:999px;font-size:12px;cursor:pointer;border:none;transition:all .2s}
.chip:hover{filter:brightness(.93)}
.avatar-opt.selected{border-color:var(--primary);background:var(--primary-soft)}
.audio-wave{display:inline-flex;align-items:center;gap:2px;height:14px}
.audio-wave span{display:inline-block;width:3px;background:currentColor;border-radius:2px;animation:wave 0.8s infinite ease-in-out}
.audio-wave span:nth-child(2){animation-delay:.15s}
.audio-wave span:nth-child(3){animation-delay:.3s}
@keyframes wave{0%,100%{height:4px}50%{height:14px}}

/* ══════════ CUTE ANIMATED ROBOT SVG ══════════ */
@keyframes robotFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes robotWave{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-18deg)}75%{transform:rotate(14deg)}}
@keyframes robotBlink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(0.1)}}
@keyframes antennaGlow{0%,100%{opacity:1;r:6}50%{opacity:.5;r:8}}
.robot-float{animation:robotFloat 3s ease-in-out infinite}
.robot-arm-wave{transform-origin:22px 86px;animation:robotWave 1.8s ease-in-out infinite}
.robot-eye{transform-origin:center 50px;animation:robotBlink 4s infinite}
.robot-antenna{animation:antennaGlow 1.5s infinite}
</style>
</head>
<body>

<!-- ══════════ TOP BAR ══════════ -->
<header id="topbar" class="surface border-b z-40 shadow-sm hidden shrink-0">
  <div class="flex flex-wrap items-center justify-between px-3 py-2 gap-2">
    <div class="flex items-center gap-2">
      <button onclick="toggleSidebar()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700" title="القائمة"><i class="fas fa-bars"></i></button>
      <div class="w-9 h-9 rounded-xl flex items-center justify-center text-white font-bold shadow-sm" style="background:var(--primary);"><i class="fas fa-robot"></i></div>
      <div>
        <span class="font-bold text-sm sm:text-base block leading-tight" id="brand">مُعلّم أوفيس الذكي</span>
        <span class="text-[10px] text-muted hidden sm:inline-block" id="voiceBadgeTop"><i class="fas fa-volume-high text-blue-500"></i> المساعد الصوتي الذكي</span>
      </div>
    </div>

    <!-- ══════════ DEVICE VIEW SWITCHER ══════════ -->
    <div class="flex items-center gap-1 rounded-xl p-1 border" style="background:var(--bg);border-color:var(--border);" role="group">
      <button onclick="setViewMode('desktop')" class="view-btn px-2 py-1 rounded-lg text-xs flex items-center gap-1" data-mode="desktop">
        <i class="fas fa-desktop"></i>
        <span class="hidden sm:inline" data-i18n="modeDesktop">كمبيوتر</span>
      </button>
      <button onclick="setViewMode('laptop')" class="view-btn px-2 py-1 rounded-lg text-xs flex items-center gap-1" data-mode="laptop">
        <i class="fas fa-laptop"></i>
        <span class="hidden sm:inline" data-i18n="modeLaptop">لابتوب</span>
      </button>
      <button onclick="setViewMode('mobile')" class="view-btn px-2 py-1 rounded-lg text-xs flex items-center gap-1" data-mode="mobile">
        <i class="fas fa-mobile-screen-button"></i>
        <span class="hidden sm:inline" data-i18n="modeMobile">موبايل</span>
      </button>
    </div>

    <div class="flex items-center gap-1">
      <button id="globalStopAudioBtn" onclick="stopAllAudio()" class="hidden px-2.5 py-1.5 rounded-lg text-xs font-bold bg-red-100 text-red-700 hover:bg-red-200 items-center gap-1">
        <span class="audio-wave"><span></span><span></span><span></span></span>
        <span data-i18n="stopAudio">إيقاف</span>
      </button>
      <button onclick="cycleTheme()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700" title="تغيير السمة"><i class="fas fa-moon" id="themeIcon"></i></button>
      <button onclick="toggleLanguage()" class="px-2.5 py-1.5 rounded-lg text-xs font-bold btn-soft"><span id="langLabel">EN</span></button>
      <button onclick="openSettings()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700" title="الإعدادات"><i class="fas fa-cog"></i></button>
    </div>
  </div>
</header>

<div class="app-shell">
  <!-- ══════════ SIDEBAR ══════════ -->
  <aside id="sidebar" class="surface w-60 h-full overflow-y-auto p-3 hidden shrink-0 border-e" style="border-color:var(--border);">
    <nav id="navLinks" class="space-y-1"></nav>
  </aside>

  <!-- ══════════ MAIN VIEWPORT STAGE ══════════ -->
  <main class="viewport-stage">
    <div id="viewportBanner" class="hidden text-center mb-1.5 shrink-0">
      <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold surface shadow-sm">
        <i id="viewportBannerIcon" class="fas fa-laptop text-blue-500"></i>
        <span id="viewportBannerText">معاينة وضع اللابتوب</span>
        <button onclick="setViewMode('desktop')" class="underline text-blue-600 ms-2" data-i18n="resetDesktop">العودة للكمبيوتر</button>
      </span>
    </div>

    <div id="appFrame" class="app-frame desktop">
      <div id="pageContent" class="fade-in h-full"></div>
    </div>
    <div id="laptopBase" class="laptop-base hidden"></div>
  </main>
</div>

<!-- ══════════ SETTINGS MODAL ══════════ -->
<div id="settingsModal" class="modal-backdrop hidden">
  <div class="surface rounded-2xl p-5 w-full max-w-lg max-h-[88vh] overflow-y-auto shadow-2xl">
    <div class="flex justify-between items-center mb-4 pb-2 border-b" style="border-color:var(--border);">
      <h2 class="text-xl font-bold"><i class="fas fa-cog text-blue-600"></i> <span data-i18n="settings">الإعدادات</span></h2>
      <button onclick="closeModal('settingsModal')" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg"><i class="fas fa-times"></i></button>
    </div>

    <div class="space-y-4">
      <!-- SMART VOICE SETTINGS -->
      <div class="p-4 rounded-xl border-2 border-blue-400/40" style="background:var(--primary-soft);">
        <div class="flex items-center justify-between mb-2">
          <div class="font-bold text-sm flex items-center gap-2">
            <i class="fas fa-wand-magic-sparkles text-blue-600"></i>
            <span data-i18n="smartVoiceTitle">المساعد الصوتي الذكي (عربي / إنجليزي)</span>
          </div>
          <span class="text-[10px] px-2 py-0.5 rounded-full bg-blue-600 text-white font-bold">HD Voice</span>
        </div>

        <label class="block text-xs font-bold mb-1" data-i18n="ttsEngineLabel">محرك النطق الصوتي</label>
        <select id="ttsEngine" class="w-full surface rounded-lg px-3 py-2 mb-3 text-sm font-semibold">
          <option value="gemini">الصوت الذكي فائق الوضوح (عربي وإنجليزي تلقائي)</option>
          <option value="browser">صوت النظام الافتراضي (بدون إنترنت)</option>
        </select>

        <div id="geminiVoiceWrap">
          <label class="block text-xs font-bold mb-1" data-i18n="voicePersonaLabel">اختيار نبرة الصوت</label>
          <select id="geminiVoiceName" class="w-full surface rounded-lg px-3 py-2 mb-3 text-sm">
            <option value="Aoede">Aoede — صوت أنثوي واضح ومشرق (مُوصى به للشرح)</option>
            <option value="Kore">Kore — صوت أنثوي رصين وهادئ</option>
            <option value="Sulafat">Sulafat — صوت دافئ وودود</option>
            <option value="Puck">Puck — صوت ذكوري حيوي وواضح</option>
            <option value="Charon">Charon — صوت ذكوري تعليمي رصين</option>
            <option value="Fenrir">Fenrir — صوت ذكوري حماسي</option>
          </select>

          <button type="button" id="testVoiceBtn" onclick="testBilingualVoice()" class="btn-primary w-full py-2 px-3 rounded-lg text-xs font-bold flex items-center justify-center gap-2">
            <i class="fas fa-volume-high"></i>
            <span data-i18n="testVoiceBtn">تجربة الصوت الآن</span>
          </button>
        </div>
      </div>

      <!-- AI Chat Provider Settings -->
      <div class="p-3.5 rounded-xl border" style="border-color:var(--border);background:var(--bg);">
        <div class="font-bold text-sm mb-2"><i class="fas fa-brain text-purple-600"></i> إعدادات الذكاء الاصطناعي للمحادثة</div>
        <label class="block text-xs mb-1">المزود (Provider)</label>
        <select id="aiProvider" class="w-full surface rounded-lg px-3 py-2 mb-2 text-sm">
          <option value="local">قاعدة المعرفة الذكية (يعمل فوراً بدون مفتاح)</option>
          <option value="gemini">الذكاء الاصطناعي السحابي المتقدم</option>
        </select>
        <label class="block text-xs mb-1">مفتاح الربط الاختياري (API Key)</label>
        <input id="aiKey" type="password" placeholder="••••••••••••" class="w-full surface rounded-lg px-3 py-2 mb-1 text-sm" />
      </div>

      <div>
        <label class="block text-sm font-bold mb-2" data-i18n="theme">السمة</label>
        <div class="grid grid-cols-5 gap-2" id="themeGrid"></div>
      </div>

      <div>
        <label class="block text-sm font-bold mb-2" data-i18n="avatar">شكل الروبوت</label>
        <div class="grid grid-cols-6 gap-2" id="avatarGrid"></div>
      </div>

      <div>
        <label class="block text-sm font-bold mb-2" data-i18n="botName">اسم الروبوت</label>
        <input id="botNameInput" class="w-full surface rounded-lg px-3 py-2 text-sm" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold mb-1" data-i18n="speechRate">سرعة الصوت (<span id="rateVal">1.0</span>x)</label>
          <input type="range" min="0.7" max="1.6" step="0.1" id="speechRate" class="w-full" />
        </div>
        <div>
          <label class="block text-xs font-bold mb-1" data-i18n="fontSize">حجم الخط (<span id="fsVal">16</span>px)</label>
          <input type="range" min="13" max="20" id="fontSize" class="w-full" />
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="exportData()" class="btn-soft px-4 py-2 rounded-lg font-bold flex-1 text-sm"><i class="fas fa-download"></i> تصدير البيانات</button>
        <button onclick="openResetConfirm()" class="px-4 py-2 rounded-lg font-bold flex-1 text-sm" style="background:#fee2e2;color:#991b1b;"><i class="fas fa-trash"></i> مسح الكل</button>
      </div>
    </div>

    <div class="mt-5 flex justify-end">
      <button onclick="saveSettings()" class="btn-primary px-6 py-2.5 rounded-xl font-bold text-sm" data-i18n="save">حفظ وإغلاق</button>
    </div>
  </div>
</div>

<!-- ══════════ CONFIRM RESET MODAL ══════════ -->
<div id="resetConfirmModal" class="modal-backdrop hidden">
  <div class="surface rounded-2xl p-5 w-full max-w-sm text-center shadow-2xl">
    <div class="text-4xl text-red-500 mb-3"><i class="fas fa-triangle-exclamation"></i></div>
    <h3 class="font-bold text-lg mb-2" data-i18n="confirmResetTitle">تأكيد مسح البيانات</h3>
    <p class="text-sm text-muted mb-5" data-i18n="confirmResetDesc">سيتم مسح كافة الدروس المكتملة والمحادثات والنقاط. هل أنت متأكد؟</p>
    <div class="flex gap-2">
      <button onclick="closeModal('resetConfirmModal')" class="btn-soft py-2 rounded-xl font-bold flex-1 text-sm" data-i18n="cancel">إلغاء</button>
      <button onclick="executeResetAll()" class="py-2 rounded-xl font-bold flex-1 text-sm bg-red-600 text-white" data-i18n="confirmYes">نعم، امسح الكل</button>
    </div>
  </div>
</div>

<!-- ══════════ EMBED MODAL ══════════ -->
<div id="embedModal" class="modal-backdrop hidden">
  <div class="surface rounded-2xl p-5 w-full max-w-lg shadow-2xl">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold"><i class="fas fa-code text-indigo-600"></i> <span data-i18n="embedCode">كود التضمين</span></h2>
      <button onclick="closeModal('embedModal')" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg"><i class="fas fa-times"></i></button>
    </div>
    <p class="text-sm text-muted mb-3">انسخ الكود والصقه في أي موقع لتضمين التطبيق.</p>
    <textarea id="embedCodeArea" class="w-full h-32 surface rounded-lg p-3 text-xs font-mono" readonly></textarea>
    <div class="mt-3 flex gap-2">
      <button onclick="copyEmbed()" class="btn-primary px-4 py-2 rounded-lg font-bold flex-1"><i class="fas fa-copy"></i> نسخ</button>
      <button onclick="previewEmbed()" class="btn-soft px-4 py-2 rounded-lg font-bold flex-1"><i class="fas fa-external-link-alt"></i> معاينة</button>
    </div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script>
/* ═════════════════════════════════════════════════════════════════════════
   1. KNOWLEDGE BASE
═════════════════════════════════════════════════════════════════════════ */
const KB = [
  { id:'w-intro', lessonId:'w-u1-l1', title:'ما هو Microsoft Word؟',
    keywords:['word','ما','هو','معالج','نصوص','مقدمة','بدء','start','word processing','برنامج'],
    content:'Microsoft Word هو معالج نصوص (Word Processing) يستخدم الحاسوب لإنشاء وتحرير وطباعة المستندات. يسمح بحفظ الوثيقة والرجوع إليها لاحقاً، وتصحيح الأخطاء بسهولة، ويدعم لغات متعددة. لبدء العمل: 1) افتح قائمة Start. 2) اختر Microsoft Office. 3) انقر MS Word 2019. 4) من شاشة البداية اختر Blank document.',
    source:'الفصل الأول - أساسيات Word' },
  { id:'w-features', lessonId:'w-u1-l2', title:'خصائص Microsoft Word',
    keywords:['خصائص','ميزات','features','حماية','كلمة','مرور','فهرس','جداول','لغات','تدقيق'],
    content:'من خصائص Word: 1) كتابة بلغات متعددة. 2) التدقيق الإملائي والنحوي. 3) إعداد الصفحة (الهوامش، الاتجاه، حجم الورق). 4) التنسيق (محاذاة، خط، لون، خلفية). 5) إدراج صور وأشكال. 6) جداول وفرز ومعادلات. 7) بحث واستبدال. 8) حماية بكلمة مرور. 9) حفظ كصفحة ويب أو قالب. 10) فهرس المحتويات وإدارة المراجع.',
    source:'خصائص Word' },
  { id:'w-qat', lessonId:'w-u2-l1', title:'شريط الوصول السريع QAT',
    keywords:['qat','وصول','سريع','شريط','أدوات','undo','redo','save','تخصيص','إضافة'],
    content:'QAT (شريط أدوات الوصول السريع) هو شريط أعلى يسار Word يحتوي: Save (حفظ)، Undo (تراجع)، Redo (إعادة). لإضافة أمر: 1) انقر سهم Customize بجانب QAT. 2) اختر More Commands. 3) اختر الأمر من القائمة. 4) اضغط Add ثم OK.',
    source:'واجهة Word' },

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return JSON.parse(JSON.stringify(defaultState));
    return deepMerge(JSON.parse(JSON.stringify(defaultState)), JSON.parse(raw));
  }catch{ return JSON.parse(JSON.stringify(defaultState)); }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function deepMerge(t,s){
  for(const k in s){
    if(s[k] && typeof s[k]==='object' && !Array.isArray(s[k])){
      t[k] = deepMerge(t[k]||{}, s[k]);
    } else t[k] = s[k];
  }
  return t;
}

/* ═════════════════════════════════════════════════════════════════════════
   6. BILINGUAL SMART VOICE ENGINE (ARABIC / ENGLISH)
═════════════════════════════════════════════════════════════════════════ */
let currentAudioPlayer = null;
const ttsCache = new Map();

function base64ToArrayBuffer(base64) {
  const binaryString = atob(base64);
  const len = binaryString.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
  return bytes.buffer;
}

function pcmToWav(pcm16, sampleRate = 24000) {
  const numChannels = 1;
  const byteRate = sampleRate * numChannels * 2;
  const blockAlign = numChannels * 2;
  const dataSize = pcm16.length * 2;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);
  const writeString = (offset, string) => {
    for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
  };
  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, 16, true);
  writeString(36, 'data');
  view.setUint32(40, dataSize, true);
  let offset = 44;
  for (let i = 0; i < pcm16.length; i++, offset += 2) view.setInt16(offset, pcm16[i], true);
  return new Blob([buffer], { type: 'audio/wav' });
}

function stopAllAudio() {
  if (currentAudioPlayer) {
    currentAudioPlayer.pause();
    currentAudioPlayer.currentTime = 0;
    currentAudioPlayer = null;
  }
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  const stopBtn = $('#globalStopAudioBtn');
  if (stopBtn) {
    stopBtn.classList.add('hidden');
    stopBtn.classList.remove('flex');
  }
}

function showAudioPlayingUI(show) {
  const stopBtn = $('#globalStopAudioBtn');
  if (!stopBtn) return;
  if (show) {
    stopBtn.classList.remove('hidden');
    stopBtn.classList.add('flex');
  } else {
    stopBtn.classList.add('hidden');
    stopBtn.classList.remove('flex');
  }
}

function detectTextLanguage(text) {
  const arMatches = (text.match(/[\u0600-\u06FF]/g) || []).length;
  const enMatches = (text.match(/[a-zA-Z]/g) || []).length;
  if (arMatches > enMatches) return 'ar';
  if (enMatches > arMatches) return 'en';
  return state.lang || 'ar';
}

async function fetchWithRetry(url, options, maxRetries = 2) {
  let delay = 800;
  for (let i = 0; i < maxRetries; i++) {
    try {
      const response = await fetch(url, options);
      if (response.ok) return response;
      if (response.status === 429 || response.status >= 500) {
        await new Promise(r => setTimeout(r, delay));
        delay *= 2;
        continue;
      }
      return response;
    } catch (e) {
      if (i === maxRetries - 1) throw e;
      await new Promise(r => setTimeout(r, delay));
      delay *= 2;
    }
  }
}

async function speakText(rawText, btnEl = null, forcedLang = null) {
  stopAllAudio();
  const cleanText = String(rawText)
    .replace(/[*_#`]/g, '')
    .replace(/\s+/g, ' ')
    .trim();

  if (!cleanText) return;
  const targetLang = forcedLang || detectTextLanguage(cleanText);

  if (state.settings.ttsEngine === 'browser') {
    speakBrowserFallback(cleanText, targetLang);
    return;
  }

  const origHtml = btnEl ? btnEl.innerHTML : null;
  if (btnEl) {
    btnEl.disabled = true;
    btnEl.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${t('loadingAudio')}`;
  }

  const voiceName = state.settings.geminiVoiceName || 'Aoede';
  const cacheKey = `${targetLang}::${voiceName}::${cleanText}`;

  try {
    let audioUrl = ttsCache.get(cacheKey);
    if (!audioUrl) {
      const apiKey = state.settings.aiKey || "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;

      const promptPrefix = targetLang === 'ar'
        ? 'اقرأ النص التعليمي التالي باللغة العربية الفصحى الواضحة والسليمة: '
        : 'Read the following educational text clearly in fluent, articulate English: ';

      const payload = {
        contents: [{ parts: [{ text: promptPrefix + cleanText.slice(0, 1500) }] }],
        generationConfig: {
          responseModalities: ["AUDIO"],
          speechConfig: {
            voiceConfig: { prebuiltVoiceConfig: { voiceName: voiceName } }
          }
        },
        model: "gemini-2.5-flash-preview-tts"
      };

      const response = await fetchWithRetry(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response || !response.ok) throw new Error('TTS HTTP Error');

      const result = await response.json();
      const part = result?.candidates?.[0]?.content?.parts?.[0];
      const audioData = part?.inlineData?.data;
      const mimeType = part?.inlineData?.mimeType || 'audio/L16;rate=24000';
      if (!audioData) throw new Error('No audio data');

      const rateMatch = mimeType.match(/rate=(\d+)/);
      const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
      const pcmData = base64ToArrayBuffer(audioData);
      const pcm16 = new Int16Array(pcmData);
      const wavBlob = pcmToWav(pcm16, sampleRate);
      audioUrl = URL.createObjectURL(wavBlob);
      ttsCache.set(cacheKey, audioUrl);
    }

    const audio = new Audio(audioUrl);
    audio.playbackRate = state.settings.speechRate || 1.0;
    currentAudioPlayer = audio;
    audio.onplay = () => showAudioPlayingUI(true);
    audio.onended = () => { showAudioPlayingUI(false); currentAudioPlayer = null; };
    audio.onerror = () => { showAudioPlayingUI(false); speakBrowserFallback(cleanText, targetLang); };
    await audio.play();
  } catch (err) {
    speakBrowserFallback(cleanText, targetLang);
  } finally {
    if (btnEl && origHtml) {
      btnEl.disabled = false;
      btnEl.innerHTML = origHtml;
    }
  }
}

function speakBrowserFallback(cleanText, targetLang = 'ar') {
  if (!('speechSynthesis' in window)) {
    toast(state.lang === 'ar' ? 'المتصفح لا يدعم النطق الصوتي' : 'TTS not supported');
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(cleanText);
  u.lang = targetLang === 'ar' ? 'ar-SA' : 'en-US';
  u.rate = state.settings.speechRate || 1;
  const voices = window.speechSynthesis.getVoices();
  const match = voices.find(v => v.lang.toLowerCase().startsWith(targetLang));
  if (match) u.voice = match;
  u.onstart = () => showAudioPlayingUI(true);
  u.onend = () => showAudioPlayingUI(false);
  u.onerror = () => showAudioPlayingUI(false);
  window.speechSynthesis.speak(u);
}

    : 'Welcome to Smart Office Tutor! This is your clear voice assistant to help you master Word and PowerPoint.';

  state.viewMode = mode;
  saveState();
  const frame = $('#appFrame');

  const banner = $('#viewportBanner');
  const bannerIcon = $('#viewportBannerIcon');
  const bannerText = $('#viewportBannerText');

  if(frame) frame.className = 'app-frame ' + mode;

  if(mode === 'laptop'){
    laptopBase?.classList.remove('hidden');
    banner?.classList.remove('hidden');
    if(bannerIcon) bannerIcon.className = 'fas fa-laptop text-blue-500';
    if(bannerText) bannerText.textContent = state.lang === 'ar' ? 'معاينة وضع اللابتوب (1024px)' : 'Laptop Mode Preview (1024px)';
  } else if(mode === 'mobile'){
    laptopBase?.classList.add('hidden');
    banner?.classList.remove('hidden');
    if(bannerIcon) bannerIcon.className = 'fas fa-mobile-screen-button text-blue-500';
    if(bannerText) bannerText.textContent = state.lang === 'ar' ? 'معاينة وضع الموبايل (390px)' : 'Mobile Mode Preview (390px)';
  } else {
    laptopBase?.classList.add('hidden');
    banner?.classList.add('hidden');
  }

  const sidebar = $('#sidebar');
  if(sidebar && state.auth.loggedIn){
    if(mode === 'mobile'){
      sidebar.classList.add('hidden');
      sidebar.classList.remove('lg:block');
    } else {
      sidebar.classList.add('lg:block');
    }
  }

  $$('.view-btn').forEach(b => {
    if(b.dataset.mode === mode) b.classList.add('active');
    else b.classList.remove('active');
  });

  if(!silent){
    const labels = {
      desktop: state.lang === 'ar' ? 'وضع الكمبيوتر' : 'Desktop Mode',

      mobile: state.lang === 'ar' ? 'وضع الموبايل' : 'Mobile Mode'
    };
    toast(labels[mode]);
  }
}

function verifyDevLogin(){
  const uInput = ($('#devUserInput')?.value || '').trim();
  const pInput = ($('#devPassInput')?.value || '').trim();
  const errBox = $('#devLoginError');
  const expectedUser = state.auth.devUsername || 'Rahma';
  const expectedPass = state.auth.devPassword || '12345';

  if(uInput === expectedUser && pInput === expectedPass){
    state.auth.role = 'developer';
    state.auth.loggedIn = true;
    state.user.name = expectedUser;
    state.page = 'dashboard';
    saveState();
    $('#topbar').classList.remove('hidden');
    $('#sidebar').classList.remove('hidden');
    toast(state.lang==='ar' ? 'تم تسجيل دخول المطور بنجاح ✓' : 'Developer logged in ✓');

/* ═════════════════════════════════════════════════════════════════════════
   9. NAVIGATION (SEPARATED FOR USER VS DEVELOPER)
═════════════════════════════════════════════════════════════════════════ */
const PAGES = [
  {id:'dashboard', icon:'fa-home', color:'#2563eb', labelAr:'الرئيسية', labelEn:'Dashboard', devOnly:false},
  {id:'learning', icon:'fa-graduation-cap', color:'#16a34a', labelAr:'مركز التعلم', labelEn:'Learning', devOnly:false, userOnly:true},
  {id:'chatbot', icon:'fa-comments', color:'#7c3aed', labelAr:'اسأل الروبوت', labelEn:'Ask Bot', devOnly:false, userOnly:true},
  {id:'lab', icon:'fa-flask', color:'#0891b2', labelAr:'مساحة التدريب', labelEn:'Practice Lab', devOnly:false, userOnly:true},
  {id:'quizzes', icon:'fa-clipboard-check', color:'#d97706', labelAr:'الاختبارات', labelEn:'Quizzes', devOnly:false, userOnly:true},
  {id:'skills', icon:'fa-lightbulb', color:'#eab308', labelAr:'المهارات', labelEn:'Skills', devOnly:false, userOnly:true},
  {id:'library', icon:'fa-folder-open', color:'#2563eb', labelAr:'مكتبتي', labelEn:'Library', devOnly:false, userOnly:true},
  {id:'profile', icon:'fa-user-gear', color:'#db2777', labelAr:'ملفي', labelEn:'Profile', devOnly:false},
  {id:'admin', icon:'fa-shield-halved', color:'#dc2626', labelAr:'الإدارة', labelEn:'Admin', devOnly:true}
];

function getVisiblePages(){
  const isDev = state.auth.role === 'developer';
  const hidden = state.devStudio.hiddenTabs || [];
  const overrides = state.devStudio.tabOverrides || {};

  const basePages = PAGES.filter(p => {
    if(isDev){
      if(p.userOnly) return false;
      return true;
    } else {
      if(p.devOnly) return false;
      if(hidden.includes(p.id)) return false;
      return true;
    }
  }).map(p => {
    const ov = overrides[p.id] || {};
    const defaultDevLabelAr = p.id === 'dashboard' ? 'لوحة المطور' : (p.id === 'profile' ? 'ملف المطور' : p.labelAr);
    const defaultDevLabelEn = p.id === 'dashboard' ? 'Dev Home' : (p.id === 'profile' ? 'Dev Profile' : p.labelEn);
    return {
      ...p,
      icon: ov.icon || (isDev && p.id === 'dashboard' ? 'fa-gauge-high' : (isDev && p.id === 'profile' ? 'fa-user-shield' : p.icon)),
      color: ov.color || p.color,
      labelAr: ov.labelAr || (isDev ? defaultDevLabelAr : p.labelAr),
      labelEn: ov.labelEn || (isDev ? defaultDevLabelEn : p.labelEn)
    };
  });

  if(isDev){
    const custom = (state.devStudio.customTabs || []).map(ct => ({
      id: ct.id,
      icon: ct.icon || 'fa-layer-group',
      color: ct.color || '#2563eb',
      labelAr: ct.labelAr,
      labelEn: ct.labelEn,
      devOnly: true,
      isCustom: true,
      contentAr: ct.contentAr,
      contentEn: ct.contentEn
    }));
    return [...basePages, ...custom];
  }
  return basePages;
}

function getPageLabel(p){
  return state.lang === 'ar' ? p.labelAr : p.labelEn;
}

function renderNav(){
  const nav = $('#navLinks');
  if(!nav) return;
  const visible = getVisiblePages();
  const isDev = state.auth.role === 'developer';

  if(isDev && !visible.some(p => p.id === state.page)){
    state.page = 'dashboard';
  }

  nav.innerHTML = visible.map(p => `
    <a href="#" onclick="navigate('${p.id}');return false;"
       class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700/60 ${state.page === p.id ? 'active' : ''}">
      <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs shrink-0" style="background:${p.color}18;color:${p.color};">
        <i class="fas ${p.icon}"></i>
      </span>
      <span class="text-sm flex-1">${esc(getPageLabel(p))}</span>
      ${isDev ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 font-bold"><i class="fas fa-code"></i></span>` : ''}
    </a>
  `).join('') + (isDev ? `
    <div class="pt-3 mt-3 border-t space-y-1" style="border-color:var(--border);">
      <a href="#" onclick="openEmbed();return false;" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700/60 text-sm">
        <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs shrink-0 bg-indigo-100 text-indigo-600">
          <i class="fas fa-code"></i>
        </span>
        <span>${t('embedCode')}</span>
      </a>
    </div>
  ` : '') + `
    <div class="pt-3 mt-3 border-t" style="border-color:var(--border);">
      <button onclick="logoutToRoleSelect()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-950/30 font-bold">
        <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs shrink-0 bg-red-100 text-red-600">
          <i class="fas fa-right-from-bracket"></i>
        </span>
        <span>${t('switchRole')}</span>
      </button>
    </div>
  `;
}

function navigate(page){
  const isDev = state.auth.role === 'developer';
  const visible = getVisiblePages();
  const allowed = isDev
    ? visible.some(p => p.id === page)
    : (visible.some(p => p.id === page) || page === 'lesson');
  state.page = allowed ? page : 'dashboard';
  saveState();
  renderNav();
  render();
  const frame = $('#appFrame');
  if(frame) frame.scrollTop = 0;
}

/* ═════════════════════════════════════════════════════════════════════════
   10. RENDER ROUTER
═════════════════════════════════════════════════════════════════════════ */
function render(){
  document.body.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  $$('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = t(key);
    if(val) el.textContent = val;
  });

  const c = $('#pageContent');
  if(!c) return;

  if(state.page === 'splash'){ c.innerHTML = viewSplash(); return; }
  if(state.page === 'role_select'){ c.innerHTML = viewRoleSelect(); return; }
  if(state.page === 'user_login'){ c.innerHTML = viewUserLogin(); return; }
  if(state.page === 'dev_login'){ c.innerHTML = viewDevLogin(); return; }

  const isDev = state.auth.role === 'developer';
  const customTab = (state.devStudio.customTabs || []).find(ct => ct.id === state.page);
  if(customTab && isDev){
    c.innerHTML = viewCustomDevTab(customTab);
    return;
  }

  if(isDev){
    switch(state.page){
      case 'dashboard': c.innerHTML = viewDevDashboard(); break;
      case 'profile': c.innerHTML = viewDevProfile(); break;
      case 'admin': c.innerHTML = viewAdmin(); break;
      default: c.innerHTML = viewDevDashboard();
    }
    return;
  }

  switch(state.page){
    case 'dashboard': c.innerHTML = viewDashboard(); break;
    case 'learning': c.innerHTML = viewLearning(); break;
    case 'lesson': c.innerHTML = viewLesson(); break;
    case 'chatbot': c.innerHTML = viewChatbot(); setTimeout(initChat, 50); break;
    case 'lab': c.innerHTML = viewLab(); break;
    case 'quizzes': c.innerHTML = viewQuizzes(); break;
    case 'skills': c.innerHTML = viewSkills(); break;
    case 'library': c.innerHTML = viewLibrary(); break;
    case 'profile': c.innerHTML = viewProfile(); break;
    default: c.innerHTML = viewDashboard();
  }
}

function saveDevProfileCredentials(){
  const nameVal = ($('#devProfileName')?.value || '').trim();
  const newPass = ($('#devNewPass')?.value || '').trim();
  const confPass = ($('#devConfirmPass')?.value || '').trim();
  const isAr = state.lang === 'ar';

  if(!nameVal){
    toast(isAr ? 'يرجى إدخال اسم المطور' : 'Please enter developer name');
    return;
  }
  if(newPass || confPass){
    if(newPass.length < 3){
      toast(isAr ? 'كلمة المرور قصيرة جداً' : 'Password is too short');
      return;
    }
    if(newPass !== confPass){
      toast(isAr ? 'كلمتا المرور غير متطابقتين!' : 'Passwords do not match!');
      return;
    }
    state.auth.devPassword = newPass;

  state.auth.devUsername = nameVal;
  state.user.name = nameVal;
  saveState();
  toast(isAr ? 'تم حفظ بيانات المطور وتحديث كلمة المرور ✓' : 'Developer profile & password updated ✓');
  render();
}

function addDeveloperLesson(){
  const prog = $('#newLessonProg').value;
  const icon = $('#newLessonIcon').value;
  const titleAr = ($('#newLessonTitleAr').value || '').trim();
  const titleEn = ($('#newLessonTitleEn').value || '').trim() || titleAr;
  const contentAr = ($('#newLessonContentAr').value || '').trim();
  const contentEn = ($('#newLessonContentEn').value || '').trim() || contentAr;
  const image = ($('#newLessonImage').value || '').trim();

  if(!titleAr || !contentAr){
    toast(state.lang==='ar' ? 'يرجى إدخال عنوان ومحتوى الدرس' : 'Please enter lesson title and content');
    return;
  }

  state.devStudio.customLessons.push({
    id: 'custom_l_' + Date.now(),
    program: prog,
    icon,
    titleAr, titleEn,
    contentAr, contentEn,
    image
  });
  saveState();
  toast(state.lang==='ar' ? 'تمت إضافة الدرس وتغذية الشات بوت بنجاح ✓' : 'Lesson added & chatbot fed ✓');
  render();
}

function deleteLessonByDev(id){
  state.devStudio.customLessons = (state.devStudio.customLessons || []).filter(l => l.id !== id);
  if(!state.devStudio.deletedLessonIds.includes(id)){
    state.devStudio.deletedLessonIds.push(id);
  }
  saveState();
  toast(state.lang==='ar' ? 'تم حذف الدرس' : 'Lesson deleted');
  render();
}

function deleteUserFileByDev(idx){
  state.user.files.splice(idx, 1);
  saveState();
  toast(state.lang==='ar' ? 'تم حذف الملف' : 'File deleted');
  render();
}

function addCustomDevTab(){
  const labelAr = ($('#newTabLabelAr').value || '').trim();
  const labelEn = ($('#newTabLabelEn').value || '').trim() || labelAr;
  const icon = $('#newTabIcon').value;
  const contentAr = ($('#newTabContentAr').value || '').trim();
  if(!labelAr){
    toast(state.lang==='ar' ? 'أدخل اسم التبويب' : 'Enter tab label');
    return;
  }
  state.devStudio.customTabs.push({
    id: 'dev_tab_' + Date.now(),
    labelAr, labelEn, icon,
    color: '#7c3aed',
    contentAr, contentEn: contentAr
  });
  saveState();
  renderNav();
  toast(state.lang==='ar' ? 'تم إنشاء التبويب بنجاح ✓' : 'Custom tab created ✓');
  render();
}

function deleteCustomDevTab(idx){
  state.devStudio.customTabs.splice(idx, 1);
  saveState();
  renderNav();
  render();
}

function saveDevWelcomeTexts(){
  state.devStudio.welcomeTitleAr = $('#editWelcomeTitleAr').value;

function getConv(){

    state.ctx.conversationId = conv.id;

function renderMessages(conv){

    return `<div class="text-center text-muted py-6">

  return conv.messages.map((m, idx) => m.role === 'user'
    ? `<div class="flex justify-end"><div class="chat-user">${esc(m.content)}</div></div>`
    : `<div class="flex justify-start gap-2">

  const conv = getConv();
  if (conv && conv.messages[idx]) speakText(conv.messages[idx].content, btnEl);
}

  const conv = getConv();

}
function newChat(){ state.ctx.conversationId = null; saveState(); render(); }
function loadConv(id){ state.ctx.conversationId = id; saveState(); render(); }
function toggleHistory(){ $('#historyPanel').classList.toggle('hidden'); }
function quickAsk(q){ const input = $('#chatInput'); if(input){ input.value = q; sendChat(); } }

function getSuggestions(){
  const base = {
    ar:['ما هو Microsoft Word؟','كيف أضيف أمراً إلى QAT؟','ما الفرق بين Animation وTransition؟','كيف أحفظ المستند بصيغة PDF؟'],
    en:['What is Microsoft Word?','How to add command to QAT?','Animation vs Transition?','How to save as PDF?']
  };
  return base[state.lang] || base.ar;
}

function normalizeAr(text){
  return String(text || '').toLowerCase()
    .replace(/[\u064B-\u0652\u0670\u0640]/g,'')
    .replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/[^\w\s\u0600-\u06FF]/g,' ').replace(/\s+/g,' ').trim();
}
function tokenize(text){
  return normalizeAr(text).split(' ').filter(w => w.length > 1);
}

function localSearch(query){
  const qTokens = tokenize(query);
  if(!qTokens.length) return [];
  const effKB = getEffectiveKB();
  const scored = effKB.map(doc => {
    const docTokens = tokenize(doc.title+' '+doc.content+' '+(doc.keywords||[]).join(' '));
    let score = 0;
    for(const tok of qTokens){
      if(docTokens.includes(tok)) score += 2;
    }
    return {...doc, score};
  });
  return scored.filter(d => d.score > 0).sort((a,b) => b.score - a.score).slice(0, 2);
}

async function sendChat(){
  const input = $('#chatInput');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  const conv = getConv();
  conv.messages.push({role:'user', content:text, time:Date.now()});
  if(!conv.title) conv.title = text.slice(0,40);
  saveState();
  const box = $('#chatMessages');
  box.innerHTML = renderMessages(conv);
  box.scrollTop = box.scrollHeight;

  const results = localSearch(text);
  const ar = state.lang === 'ar';
  let reply = '';
  if(results.length){
    reply = `📚 ${results[0].title}\n\n${results[0].content}`;
  } else {
    reply = ar
      ? 'سؤال رائع! يمكنك مراجعة دروس Word و PowerPoint في مركز التعلم للحصول على شرح تفصيلي وخطوات عملية.'
      : 'Great question! You can explore Word and PowerPoint lessons in the Learning Center for detailed steps.';
  }
  conv.messages.push({role:'assistant', content:reply, time:Date.now()});
  saveState();
  box.innerHTML = renderMessages(conv);
  box.scrollTop = box.scrollHeight;
}

function copyText(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  toast(t('copied'));
}

let recognition = null, isRec = false;
function toggleVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast(state.lang==='ar'?'المتصفح لا يدعم الإدخال الصوتي':'Voice input not supported'); return; }
  if(isRec){ recognition.stop(); return; }
  recognition = new SR();
  recognition.lang = state.lang === 'ar' ? 'ar-SA' : 'en-US';
  recognition.onstart = () => { isRec = true; $('#micBtn')?.classList.add('pulse-rec'); };
  recognition.onend = () => { isRec = false; $('#micBtn')?.classList.remove('pulse-rec'); };
  recognition.onresult = (e) => { const input = $('#chatInput'); if(input) input.value = e.results[0][0].transcript; };
  recognition.start();
}
function initChat(){ if('speechSynthesis' in window) window.speechSynthesis.getVoices(); }

  const file = input.files[0];
  if(!file) return;
  const res = document.getElementById('res_'+taskId);
  const sizeKB = Math.max(1, Math.round(file.size/1024));
  state.user.files.push({name:file.name, size:file.size, task:taskId, time:Date.now()});
  saveState();
  res.innerHTML = `<div class="p-3 rounded-xl text-sm" style="background:var(--primary-soft);">✅ ${state.lang==='ar'?'تم رفع الملف بنجاح':'File uploaded'}: ${esc(file.name)} (${sizeKB} KB)</div>`;
  toast(state.lang==='ar'?'تم الرفع':'Uploaded');
}

function startQuiz(lessonId){
  const info = findLesson(lessonId);
  if(!info || !info.quiz || !info.quiz.length) return;
  const qs = info.quiz;
  let answers = new Array(qs.length).fill(null);
  let cur = 0;
  const overlay = document.createElement('div');
  overlay.className = 'modal-backdrop';
  overlay.id = 'quizOverlay';

  function draw(){
    const q = qs[cur];
    overlay.innerHTML = `
      <div class="surface rounded-2xl p-5 w-full max-w-lg shadow-2xl">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-bold text-sm">${tL(info.title)} — ${t('quizTitle')}</h3>
          <button onclick="document.getElementById('quizOverlay').remove()" class="p-1"><i class="fas fa-times"></i></button>
        </div>
        <div class="font-bold mb-3 text-sm">${tL(q.q)}</div>
        <div class="space-y-2 mb-4">
          ${q.options.map((opt,i) => `
            <button onclick="selectQ(${i})" class="w-full text-start p-3 rounded-lg border text-sm"
              style="border-color:${answers[cur]===i?'var(--primary)':'var(--border)'};background:${answers[cur]===i?'var(--primary-soft)':'transparent'};">
              ${tL(opt)}
            </button>
          `).join('')}
        </div>
        <div class="flex justify-between gap-2">
          <button onclick="prevQ()" class="surface px-4 py-2 rounded-lg text-sm" ${cur===0?'disabled':''}>${t('prev')}</button>
          ${cur < qs.length-1
            ? `<button onclick="nextQ()" class="btn-primary px-4 py-2 rounded-lg font-bold text-sm" ${answers[cur]===null?'disabled':''}>${t('next')}</button>`
            : `<button onclick="submitQ()" class="btn-primary px-4 py-2 rounded-lg font-bold text-sm" ${answers[cur]===null?'disabled':''}>${t('submit')}</button>`}
        </div>
      </div>
    `;
  }
  window.selectQ = i => { answers[cur] = i; draw(); };
  window.prevQ = () => { if(cur>0){ cur--; draw(); } };
  window.nextQ = () => { if(answers[cur]!==null && cur<qs.length-1){ cur++; draw(); } };
  window.submitQ = () => {
    let score = 0;
    qs.forEach((q,i) => { if(answers[i] === q.answer) score++; });
    state.user.quizResults[lessonId] = {score, total:qs.length, time:Date.now()};
    state.user.points += score * 5;
    saveState();
    overlay.innerHTML = `
      <div class="surface rounded-2xl p-6 w-full max-w-lg text-center shadow-2xl">
        <div class="text-5xl mb-3">${score===qs.length?'🏆':'👏'}</div>
        <h3 class="text-xl font-bold mb-2">${t('score')}: ${score}/${qs.length}</h3>
        <button onclick="document.getElementById('quizOverlay').remove();render()" class="btn-primary px-6 py-2 rounded-lg font-bold text-sm">${t('save')}</button>
      </div>
    `;
  };
  document.body.appendChild(overlay);
  draw();
}

          ${ppt.map(s => `<button onclick="quickAskFromSkill('${s}')" class="w-full text-start p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-sm flex justify-between items-center mb-1">

function quickAskFromSkill(skill){
  navigate('chatbot');
  setTimeout(() => {
    const input = $('#chatInput');
    if(input){
      input.value = state.lang === 'ar' ? `كيف أتعلم ${skill}؟` : `How do I learn ${skill}?`;
      input.focus();
    }
  }, 100);
}

function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'smart-office-tutor-data.json';
  a.click();
}
function openResetConfirm(){ $('#resetConfirmModal').classList.remove('hidden'); }
function executeResetAll(){ localStorage.removeItem(STORAGE_KEY); location.reload(); }

function openSettings(){
  const m = $('#settingsModal');
  m.classList.remove('hidden');

  const tg = $('#themeGrid');
  tg.innerHTML = THEMES.map(th => `
    <button onclick="applyTheme('${th}');openSettings()" class="p-2 rounded-lg border text-xs ${state.theme===th?'ring-2 ring-blue-500':''}" style="border-color:var(--border);">
      <div class="w-full h-5 rounded mb-1" style="background:${th==='dark'?'#0f172a':th==='blue'?'#1d4ed8':th==='green'?'#15803d':th==='purple'?'#7c3aed':'#f8fafc'};${th==='light'?'border:1px solid #cbd5e1;':''}"></div>
      ${t(th)}
    </button>
  `).join('');

  const ag = $('#avatarGrid');
  ag.innerHTML = ['🤖','👨‍🏫','👩‍🏫','🦉','🐱','🚀'].map(a =>
    `<button onclick="state.settings.avatar='${a}';saveState();openSettings();" class="avatar-opt text-2xl p-2 rounded-lg border ${state.settings.avatar===a?'selected':''}" style="border-color:var(--border);">${a}</button>`
  ).join('');

  $('#ttsEngine').value = state.settings.ttsEngine || 'gemini';
  $('#geminiVoiceName').value = state.settings.geminiVoiceName || 'Aoede';
  $('#botNameInput').value = state.settings.botName;
  $('#aiProvider').value = state.settings.aiProvider;
  $('#aiKey').value = state.settings.aiKey;
  $('#speechRate').value = state.settings.speechRate;
  $('#rateVal').textContent = state.settings.speechRate.toFixed(1);
  $('#fontSize').value = state.settings.fontSize;
  $('#fsVal').textContent = state.settings.fontSize;

  $('#ttsEngine').onchange = () => {
    $('#geminiVoiceWrap').className = $('#ttsEngine').value === 'gemini' ? '' : 'hidden';
  };
  $('#speechRate').oninput = e => { $('#rateVal').textContent = parseFloat(e.target.value).toFixed(1); };
  $('#fontSize').oninput = e => { $('#fsVal').textContent = e.target.value; };
}

function closeModal(id){ $('#'+id).classList.add('hidden'); }
function saveSettings(){
  state.settings.ttsEngine = $('#ttsEngine').value;
  state.settings.geminiVoiceName = $('#geminiVoiceName').value;
  state.settings.botName = $('#botNameInput').value || 'أوفيس بوت';
  state.settings.aiProvider = $('#aiProvider').value;
  state.settings.aiKey = $('#aiKey').value;
  state.settings.speechRate = parseFloat($('#speechRate').value);
  state.settings.fontSize = parseInt($('#fontSize').value);
  document.body.style.fontSize = state.settings.fontSize + 'px';
  saveState();
  closeModal('settingsModal');
  toast('✓ ' + t('save'));
  render();
}

function openEmbed(){
  const m = $('#embedModal');
  m.classList.remove('hidden');
  const url = location.href.split('?')[0] + '?embed=true';
  $('#embedCodeArea').value = `<iframe src="${url}" width="100%" height="700" style="border:none;border-radius:16px;" allow="microphone; autoplay" title="Smart Office Tutor"></iframe>`;
}
function copyEmbed(){
  $('#embedCodeArea').select();
  document.execCommand('copy');
  toast(t('copied'));
}
function previewEmbed(){
  const url = location.href.split('?')[0] + '?embed=true';
  window.open(url, '_blank');
}

function init(){
  applyTheme(state.theme);
  setViewMode(state.viewMode, true);
  document.body.style.fontSize = state.settings.fontSize + 'px';
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  $('#langLabel').textContent = state.lang === 'ar' ? 'EN' : 'ع';

  if(state.auth && state.auth.loggedIn){
    $('#topbar').classList.remove('hidden');
    $('#sidebar').classList.remove('hidden');
    renderNav();
  } else {
    state.page = 'splash';
  }
  render();
  if('speechSynthesis' in window) window.speechSynthesis.getVoices();
  $$('.modal-backdrop').forEach(m => m.addEventListener('click', e => { if(e.target === m) m.classList.add('hidden'); }));
}
document.addEventListener('DOMContentLoaded', init);
</script>
